name: clean_architecture
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.3.3
  dio: ^5.11.1
  equatable: ^2.1.0
  google_fonts: ^8.2.1
  fluttertoast: ^10.0.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  flutter_spinkit: ^5.2.2
  form_field_validator: ^1.1.0
  icons_plus: ^5.0.0
  go_router: ^18.0.1
  lottie: ^3.5.1
  injectable: ^3.0.0

  skeletonizer: ^3.0.0

  # multi lanuguage
  flutter_localization: ^0.4.1
  firebase_core: ^4.14.0
  connectivity_plus: ^7.3.1
  firebase_messaging: ^16.6.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  flutter_gen_runner: ^5.15.0
  go_router_builder: ^4.5.0
  injectable_generator: ^3.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
